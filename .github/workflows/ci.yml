name: Verify published JSPI artifacts
on:
  push:
    branches: [codex/verify-jspi-native-7196-9f9eff2]

jobs:
  wasmer-jspi:
    name: Wasmer JSPI (${{ matrix.target }})
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-amd64
            os: ubuntu-22.04
          - target: windows-amd64
            os: windows-2022
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          repository: wasmerio/wasmer
          ref: 9f9eff29082f7cd96a0158288b3cda0788213a2b
          persist-credentials: false
          submodules: true
      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: wee8-package
          github-token: ${{ github.token }}
          run-id: 44212133327
      - name: Unpack wee8
        shell: bash
        run: |
          tar -xJf wee8-package/v8.tar.xz -C wee8-package
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libclang-dev llvm
      - name: Set up LLVM on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "$env:ProgramFiles\LLVM\bin" >> $env:GITHUB_PATH
          "LIBCLANG_PATH=$env:ProgramFiles\LLVM\bin" >> $env:GITHUB_ENV
      - name: Test Wasmer against the built library
        env:
          WASMER_WEE8_DIR: ${{ github.workspace }}/wee8-package
        run: cargo test --locked -p wasmer --no-default-features --features v8-default,experimental-async --test jspi_async --test simple_greenthread
