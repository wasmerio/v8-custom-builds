name: Build

on: [push]

jobs:
  build:
    name: Build
    permissions: write-all
    strategy:
      matrix:
        target:
          - id: 'linux-amd64'
            os: "ubuntu-22.04"
            native: true
          - id: 'linux-arm64'
            os: 'ubuntu-22.04'
            native: false
          - id: 'darwin-aarch64'
            os: 'macos-15'
            native: true
          # - id: 'ios'
          #   os: 'darwin-aarch64'
          #   native: false
          - id: 'android'
            os: 'ubuntu-22.04'
            native: false
          - id: 'windows-amd64'
            os: 'windows-2022'
            native: true
            # When unpacking an archive on Windows, the symlinks can't be
            # created unless the target path already exists. This causes
            # problems when the linked file is ordered after the link
            # inside the archive. Dereferencing the files when packing them
            # adds an additional copy per link, but it reliably works and
            # the additional size is not too large on Windows.
            tar_extra_args: '--dereference'
      fail-fast: false

    runs-on: ${{ matrix.target.os }}
    steps:
      - name: Check out the code
        uses: actions/checkout@v6

      - name: Install dependencies on Ubuntu
        if: startsWith(matrix.target.id, 'linux-')
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install ninja-build clang libglib2.0-dev -y

      - name: Install dependencies on Ubuntu (android)
        if: startsWith(matrix.target.id, 'android')
        shell: bash
        run: |
          sudo apt-get update
          sudo apt install gcc make gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu
          sudo apt-get install ninja-build clang libglib2.0-dev -y

      - name: Install dependencies on macOS
        if: startsWith(matrix.target.id, 'darwin-') || matrix.target.id == 'ios'
        shell: bash
        run: |
          brew install ninja llvm@18

      - name: Set default Xcode on macOS
        if: startsWith(matrix.target.id, 'darwin-') || matrix.target.id == 'ios'
        shell: bash
        run: |
          sudo xcode-select -s /Applications/Xcode_26.0.app

      - name: Install dependencies on Windows
        if: startsWith(matrix.target.id, 'windows-')
        shell: bash
        run: |
          choco install ninja

      - name: Install Windows SDK required by V8
        if: matrix.target.id == 'windows-amd64'
        shell: pwsh
        run: |
          # V8 pins SDK 10.0.28000.0; use the 10.0.28000.2270 installer.
          $installer = Join-Path $env:RUNNER_TEMP 'winsdksetup.exe'
          Invoke-WebRequest 'https://go.microsoft.com/fwlink/?linkid=2370315' -OutFile $installer
          $process = Start-Process -FilePath $installer -ArgumentList '/quiet', '/norestart', '/features', 'OptionId.DesktopCPPx64', 'OptionId.DesktopCPPx86', 'OptionId.WindowsDesktopDebuggers' -Wait -PassThru
          if ($process.ExitCode -notin @(0, 3010)) {
            throw "Windows SDK installation failed with exit code $($process.ExitCode)"
          }
          $sdk = "${env:ProgramFiles(x86)}\Windows Kits\10"
          if (-not (Test-Path "$sdk\Include\10.0.28000.0\um\Windows.h")) {
            throw 'Windows SDK 10.0.28000.0 headers were not installed'
          }

      - name: Setup MSVC (Windows) 
        uses: ilammy/msvc-dev-cmd@v1
        if: matrix.target.id == 'windows-amd64'
        with:
          sdk: '10.0.28000.0'

      - name: Build (native target) 
        if: matrix.target.id != 'windows-amd64' && matrix.target.native == true
        shell: bash
        run: |
          ./build.sh 

      - name: Build (Linux ARM64 cross-compile)
        if: matrix.target.id == 'linux-arm64'
        shell: bash
        run: |
          ./build.sh "arm64" "linux"

      - name: Build (android) 
        if: matrix.target.id == 'android'
        shell: bash
        run: |
          ./build.sh "arm64" "android"

      - name: Build (iOS)
        if: matrix.target.id == 'ios'
        shell: bash
        run: |
          ./build.sh "arm64" "ios"

      - name: Build (Windows)
        if: matrix.target.id == 'windows-amd64'
        run: |
          ./build.ps1 
        env: 
          DEPOT_TOOLS_WIN_TOOLCHAIN: 0

      - name: Test the C11 JSPI example and import binding modes
        if: matrix.target.id == 'linux-amd64'
        run: |
          for source in examples/jspi-sum.c tests/jspi-bindings.c; do
            cc -std=c11 -Wall -Wextra -Werror -Iv8/out/dist/include/wasm-c-api -c "$source" -o "$RUNNER_TEMP/test.o"
            c++ "$RUNNER_TEMP/test.o" v8/out/dist/lib/libv8.a -ldl -pthread -o "$RUNNER_TEMP/test"
            "$RUNNER_TEMP/test"
          done

      - name: Test the C11 JSPI example and import binding modes on Windows
        if: matrix.target.id == 'windows-amd64'
        shell: pwsh
        run: |
          foreach ($source in "examples/jspi-sum.c", "tests/jspi-bindings.c") {
            cl /nologo /MD /std:c11 /DLIBWASM_STATIC /Iv8/out/dist/include/wasm-c-api $source /Fe:jspi-test.exe /link v8/out/dist/lib/v8.lib winmm.lib dbghelp.lib shlwapi.lib advapi32.lib
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
            .\jspi-test.exe
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }

      - name: Zip
        if: matrix.target.id != 'windows-amd64'
        shell: bash
        run: |
          mkdir -p dist
          tar --directory v8/out/dist --create --xz --verbose ${{ matrix.target.tar_extra_args }} --file dist/v8.tar.xz include lib
          ls -lh dist/v8.tar.xz

      - name: Zip (Windows)
        if: matrix.target.id == 'windows-amd64'
        shell: bash
        run: |
          mkdir -p dist
          tar --directory v8/out/dist --create --xz --verbose ${{ matrix.target.tar_extra_args }} --file dist/v8.tar.xz include lib
          ls -lh dist/v8.tar.xz

      # - name: Zip (dummy for testing)
      #   run: |
      #     mkdir -p release/include release/lib
      #     echo "dummy" > release/lib/libv8.a
      #     echo "dummy" > release/include/v8.h
      #     mkdir -p dist
      #     tar --directory release --create --xz --verbose ${{ matrix.target.tar_extra_args }} --file dist/v8.tar.xz include lib
      #     ls -lh dist/v8.tar.xz

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target.id }}
          path: dist
          if-no-files-found: error
          retention-days: 1

  wasmer-revision:
    name: Select Wasmer revision for JSPI tests
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      sha: ${{ steps.consumer.outputs.sha }}
    steps:
      - id: consumer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/wasmerio/wasmer/pulls/7200 --jq '"sha=" + (if .merged then .merge_commit_sha else .head.sha end)' >> "$GITHUB_OUTPUT"

  wasmer-jspi:
    name: Wasmer JSPI (${{ matrix.target }})
    needs: [build, wasmer-revision]
    # Exercise any available native artifacts even if a cross-build failed.
    if: ${{ !cancelled() && needs.wasmer-revision.result == 'success' }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-amd64
            os: ubuntu-22.04
          - target: windows-amd64
            os: windows-2022
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          repository: wasmerio/wasmer
          ref: ${{ needs.wasmer-revision.outputs.sha }}
          persist-credentials: false
          submodules: true
      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: wee8-package
      - name: Unpack wee8
        shell: bash
        run: |
          tar -xJf wee8-package/v8.tar.xz -C wee8-package
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libclang-dev llvm
      - name: Set up LLVM on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "$env:ProgramFiles\LLVM\bin" >> $env:GITHUB_PATH
          "LIBCLANG_PATH=$env:ProgramFiles\LLVM\bin" >> $env:GITHUB_ENV
      - name: Test Wasmer against the built library
        env:
          WASMER_WEE8_DIR: ${{ github.workspace }}/wee8-package
        run: cargo test --locked -p wasmer --no-default-features --features v8-default,experimental-async --test jspi_async --test simple_greenthread

  release:
    name: Release
    runs-on: ubuntu-latest
    permissions: write-all
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Download the Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Get tag name
        id: get_tag
        run: echo "TAG=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Inspect
        shell: bash
        run: |
          ls -laGiR ./*

      - name: Create Release
        id: create_release
        uses: ncipollo/release-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag: ${{ steps.get_tag.outputs.TAG }}
          name: Release ${{ steps.get_tag.outputs.TAG }}
          allowUpdates: true
          draft: false
          prerelease: false

      - name: Upload Release Asset Linux
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: artifacts/linux-amd64/v8.tar.xz
          asset_name: v8-linux-amd64.tar.xz
          asset_content_type: application/gzip

      - name: Upload Release Asset Linux (arm64)
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: artifacts/linux-arm64/v8.tar.xz
          asset_name: v8-linux-arm64.tar.xz
          asset_content_type: application/gzip

      - name: Upload Release Asset Darwin (aarch64)
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: artifacts/darwin-aarch64/v8.tar.xz
          asset_name: v8-darwin-aarch64.tar.xz
          asset_content_type: application/gzip
          
      # - name: Upload Release Asset iOS
      #   uses: actions/upload-release-asset@v1
      #   env:
      #     GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      #   with:
      #     upload_url: ${{ steps.create_release.outputs.upload_url }}
      #     asset_path: artifacts/ios/v8.tar.xz
      #     asset_name: v8-ios.tar.xz
      #     asset_content_type: application/gzip

      - name: Upload Release Asset Android
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: artifacts/android/v8.tar.xz
          asset_name: v8-android-arm64.tar.xz
          asset_content_type: application/gzip

      - name: Upload Release Asset Windows
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: artifacts/windows-amd64/v8.tar.xz
          asset_name: v8-windows-amd64.tar.xz
          asset_content_type: application/gzip
